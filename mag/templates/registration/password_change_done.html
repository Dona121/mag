{% extends "base/base.html" %}
{% block titulo %}Contraseña actualizada{% endblock %}

{% block contenido %}
<div class="seccion-titulo">
    <h1>Contraseña actualizada</h1>
</div>

<div class="card" style="max-width: 560px;">
    <p style="margin-top:0;">
        Su contraseña se ha cambiado correctamente. Las próximas sesiones deberán
        usar la nueva contraseña.
    </p>
    <div class="form-actions">
        <a class="btn btn-primario" href="{% url 'contenido:dashboard' %}">Volver al inicio</a>
        <a class="btn btn-borde" href="{% url 'contenido:password_change' %}">Cambiar de nuevo</a>
    </div>
</div>
{% endblock %}
